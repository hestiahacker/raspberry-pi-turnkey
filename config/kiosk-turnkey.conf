# Installed as /etc/systemd/system/kiosk.service.d/turnkey.conf when
# kiosk.service is present.  kiosk.service comes from another repo, so this
# override is opt-in instead of editing that unit in place.
[Unit]
Wants=turnkey.service
After=turnkey.service

[Service]
# startup.py decides AP/client mode a few seconds after turnkey.service starts.
# Let that decision land before kiosk renders its loader page.
ExecStartPre=/bin/bash /home/pi/scripts/raspberry-pi-turnkey/wait-for-turnkey-status.sh
